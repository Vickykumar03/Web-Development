<!-- Handle HTML form validation using JavaScript events like onsubmit, oninput,
and use alert() for feedback. -->

<!DOCTYPE html>
<html>
<head>
    <title>Form Validation Demo</title>
    <style>
        input {
            margin-bottom: 10px;
            display: block;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h2>Registration Form</h2>

<form id="myForm" onsubmit="return validateForm()">
    <label>Name:</label>
    <input type="text" id="name" oninput="clearError('nameError')">
    <span id="nameError" class="error"></span>

    <label>Email:</label>
    <input type="text" id="email" oninput="clearError('emailError')">
    <span id="emailError" class="error"></span>

    <label>Password:</label>
    <input type="password" id="password" oninput="clearError('passError')">
    <span id="passError" class="error"></span>

    <button type="submit">Submit</button>
</form>

<script>

function clearError(id) {
    document.getElementById(id).innerText = "";
}

function validateForm() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    let valid = true;

    
    if (name === "") {
        document.getElementById("nameError").innerText = "Name is required";
        valid = false;
    }

    if (email === "" || !email.includes("@")) {
        document.getElementById("emailError").innerText = "Enter a valid email";
        valid = false;
    }

    if (password.length < 6) {
        document.getElementById("passError").innerText = "Password must be at least 6 characters";
        valid = false;
    }

    if (!valid) {
        alert("Please correct the errors before submitting");
        return false; 
    }

    alert("Form submitted successfully");
    return true;
}
</script>

</body>
</html>
