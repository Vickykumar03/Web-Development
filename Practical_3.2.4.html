<!--2.4find the sum of first 10 even numbers-->
<!DOCTYPE html>
<html>
    <head><title>sum of even number</title></head>
    <body>
        <p>Sum of first 10 even numbers</p>
        <script>
            let sum=0;
            for(let i=1;i<=20;i++){
                if(i%2==0){
                    sum+=i;
                }
            }
            document.write(sum);
        </script>
    </body>
</html>
