<!--2.3Sum of first 10 natural number-->
<!DOCTYPE html>
<html>
    <head>Sum Of numbers <br> <br> </head>
    <body>
        <script>
            let i;
            let sum=0;
            for(i=1;i<=10;i++){
                sum+=i;
            }
            document.write('Sum of 10 natural no. '+ sum +'<br>');
        </script>
    </body>
</html>
