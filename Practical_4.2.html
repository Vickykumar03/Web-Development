<!-- Add interactivity using event listeners (addEventListener,removeEventListener) for mouse/keyboard events -->

<!DOCTYPE html>
<html>
<head>
  <title>Event Listener Example</title>

  <style>
    #box {
      width: 200px;
      height: 100px;
      background: lightgreen;
      margin-top: 20px;
      text-align: center;
      line-height: 100px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <button id="add">Add Click Event</button>
  <button id="remove">Remove Click Event</button>

  <div id="box">Click Me</div>
  <p id="msg"></p>

  <script>
    const box = document.getElementById("box");
    const msg = document.getElementById("msg");

   
    function changeColor() {
      box.style.background = "orange";
      msg.innerText = "Box clicked!";
    }

    
    document.getElementById("add").addEventListener("click", () => {
      box.addEventListener("click", changeColor);
      msg.innerText = "Click event added";
    });

   
    document.getElementById("remove").addEventListener("click", () => {
      box.removeEventListener("click", changeColor);
      msg.innerText = "Click event removed";
    });

    
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        box.style.background = "lightblue";
        msg.innerText = "Enter key pressed!";
      }
    });
  </script>

</body>
</html>
