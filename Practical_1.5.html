<!-- use semantic elements (<article,<section>,<nav>,<aside>,<footer>) to build a structured web page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic_elements</title>
</head>
<body>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a href="#">Services</a>
  </nav>
  <section>
    <article>
      <p>This is me,article tag under section tag and welcomes you</p>
    </article>

    <article>
      <p>Let's learn about semantic tags and their uses</p>
    </article>
  </section>

  <aside>
    <ul>
    <li><a href="#">HTML</a></li>
    <li><a href="#">CSS</a></li>
    <li><a href="#">Javascript</a></li>
    </ul>
  </aside>

  <footer>
    <p>&copy;All rights are reserved</p>
  </footer>
</body>
</html>
