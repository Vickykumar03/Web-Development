<!--2.1.Write javascript to demonstrate conditional statement and looping 
Whether the user is eligible to vote or not-->
<!DOCTYPE html>
<html>
<head><title>conditional statement</title></head>
   <body>
    <p><h2>Whether the user is eligible to vote or not</h2></p>
     <script>
        let age=parseInt(prompt("Enter your age"));
   
        if(age>18 && age<120){
            document.write("The person's age is " + age + " and he is Eligible to vote");
            }
        else{
            document.write("The person's age is " + age + " and he is Not eligible to vote");
            }
        </script>
    </body>
</html>
