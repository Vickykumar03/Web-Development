<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Example</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption><strong>Weekly Class Schedule</strong></caption>

        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td><strong>9:00 AM</strong></td>
                <td>Math</td>
                <td>Web-Tech</td>
                <td>Math</td>
                <td>Web-Tech</td>
                <td>Math</td>
            </tr>

            <tr>
                <td><strong>10:00 AM</strong></td>
                <td>PFC</td>
                <td>NALS</td>
                <td>Math</td>
                <td>Web-Tech Lab</td>
                <td>English</td>
            </tr>

            <tr>
                <td><strong>11:00 AM</strong></td>
                <td>NALS</td>
                <td>PFC</td>
                <td>English</td>
                <td>DL</td>
                <td>-</td>
            </tr>

            <tr>
                <td><strong>12:00 PM</strong></td>
                <td>Web-Tech</td>
                <td>Math</td>
                <td>Activity</td>
                <td>English</td>
                <td>DL</td>
            </tr>

            <tr>
                <td><strong>1:00 PM</strong></td>
                <td colspan="5" align="center"><strong>LUNCH BREAK</strong></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
