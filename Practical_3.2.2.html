<!--2.2.Find number is even or odd-->
<!DOCTYPE html>
<html>
    <head>
        <title>Even or odd</title>
    </head>
    <body>
        <script>
            let n=56;
            if(n%2==0){
                document.write("Even");
            }
            else{
                document.write("Odd");
            }
        </script>
    </body>
</html>
